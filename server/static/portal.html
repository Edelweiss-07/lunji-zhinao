<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轮机智脑 · 12K98ME-C7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg-deep:#0a0e14;
  --bg-surface:#0f1620;
  --bg-glass:rgba(15,22,32,0.72);
  --border:rgba(0,212,255,0.15);
  --text:#e0e6ed;
  --text-dim:#8b9bb4;
  --text-muted:#5a6a80;
  --cyan:#00d4ff;
  --green:#00d68f;
  --gold:#f0a500;
}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Segoe UI','Microsoft YaHei',sans-serif;
  background:var(--bg-deep);
  color:var(--text);
  font-size:13px;
  display:flex;
  flex-direction:column;
  position:relative;
}
body::before{
  content:'';
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 60% 40% at 20% 0%,rgba(0,212,255,0.06) 0%,transparent 55%),
    radial-gradient(ellipse 50% 40% at 80% 0%,rgba(0,214,143,0.05) 0%,transparent 55%);
}

/* ===== Top bar — glassmorphism ===== */
.topbar{
  height:64px;
  background:var(--bg-glass);
  backdrop-filter:blur(22px) saturate(160%);
  -webkit-backdrop-filter:blur(22px) saturate(160%);
  border-bottom:1px solid var(--border);
  display:flex;
  align-items:center;
  padding:0 28px;
  gap:8px;
  flex-shrink:0;
  position:relative;
  z-index:10;
  box-shadow:0 4px 24px rgba(0,0,0,0.35);
}
.topbar::after{
  content:'';
  position:absolute;
  bottom:0;left:0;right:0;
  height:1px;
  background:linear-gradient(90deg,transparent 0%,var(--cyan) 20%,var(--green) 50%,var(--cyan) 80%,transparent 100%);
  opacity:0.45;
  box-shadow:0 0 12px rgba(0,212,255,0.3);
}

/* ===== Brand ===== */
.brand{
  display:flex;
  align-items:center;
  gap:10px;
  padding-right:20px;
  margin-right:8px;
  position:relative;
}
.brand-icon{
  font-size:24px;
  color:var(--cyan);
  filter:drop-shadow(0 0 8px rgba(0,212,255,0.5));
  animation:brandPulse 3s ease-in-out infinite;
}
@keyframes brandPulse{
  0%,100%{filter:drop-shadow(0 0 8px rgba(0,212,255,0.5))}
  50%{filter:drop-shadow(0 0 14px rgba(0,212,255,0.85))}
}
.brand-text{
  font-size:16px;
  font-weight:700;
  color:var(--text);
  letter-spacing:0.5px;
}
.brand-sub{
  font-size:11px;
  color:var(--text-muted);
  margin-left:2px;
  letter-spacing:0.05em;
}

/* ===== Tabs ===== */
.tabs{display:flex;align-items:center;gap:2px}
.tab{
  padding:7px 14px;
  font-size:13px;
  color:var(--text-dim);
  cursor:pointer;
  border-radius:8px;
  display:flex;
  align-items:center;
  gap:6px;
  transition:all .2s ease;
  text-decoration:none;
  border:1px solid transparent;
  position:relative;
}
.tab:hover{
  color:var(--text);
  background:rgba(255,255,255,0.04);
  transform:translateY(-1px);
}
.tab.active{
  color:var(--green);
  background:rgba(0,214,143,0.1);
  border-color:rgba(0,214,143,0.35);
  box-shadow:0 0 16px rgba(0,214,143,0.2),inset 0 0 12px rgba(0,214,143,0.05);
}
.tab.active::after{
  content:'';
  position:absolute;
  bottom:-1px;left:20%;right:20%;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--green),transparent);
  border-radius:2px;
  box-shadow:0 0 8px var(--green);
}
.tab-icon{font-size:14px}

.tab-sep{
  width:1px;
  height:22px;
  background:linear-gradient(180deg,transparent,rgba(255,255,255,0.12),transparent);
  margin:0 6px;
}

/* New sensor monitor button — highlighted */
.tab.new-btn{
  color:var(--cyan);
  background:rgba(0,212,255,0.1);
  border:1px solid rgba(0,212,255,0.45);
  font-weight:600;
  position:relative;
  box-shadow:0 0 12px rgba(0,212,255,0.15);
}
.tab.new-btn:hover{
  color:#fff;
  background:rgba(0,212,255,0.22);
  box-shadow:0 0 20px rgba(0,212,255,0.4),inset 0 0 12px rgba(0,212,255,0.1);
  transform:translateY(-1px);
}
.tab.new-btn::before{
  content:'';
  position:absolute;
  top:-1px;left:8px;right:8px;
  height:2px;
  background:linear-gradient(90deg,transparent,var(--cyan),transparent);
  border-radius:2px;
  box-shadow:0 0 6px var(--cyan);
}
.tab.new-btn .live-dot{
  width:6px;height:6px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 6px var(--green);
  animation:pulse 1.5s infinite;
  margin-left:2px;
}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* ===== Status ===== */
.status{
  margin-left:auto;
  display:flex;
  align-items:center;
  gap:8px;
  padding:6px 14px;
  background:rgba(0,214,143,0.08);
  border:1px solid rgba(0,214,143,0.25);
  border-radius:24px;
  box-shadow:0 0 12px rgba(0,214,143,0.1),inset 0 0 8px rgba(0,214,143,0.04);
  transition:all .3s ease;
}
.status:hover{
  box-shadow:0 0 20px rgba(0,214,143,0.22),inset 0 0 12px rgba(0,214,143,0.06);
}
.status-dot{
  width:7px;height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 8px var(--green);
  animation:pulse 2s infinite;
}
.status-text{font-size:12px;color:var(--text);font-weight:500}
.status-info{
  font-size:11px;
  color:var(--text-muted);
  font-family:'Consolas','SF Mono',monospace;
  margin-left:4px;
  padding-left:8px;
  border-left:1px solid rgba(255,255,255,0.08);
}

/* ===== Gradio iframe ===== */
.app-frame{
  flex:1;
  width:100%;
  border:none;
  background:var(--bg-deep);
  position:relative;
  z-index:1;
}

/* ===== Shark mascot — 统一品牌陪伴 ===== */
.shark-mascot{
  position:fixed;
  bottom:20px;
  right:20px;
  width:72px;
  height:72px;
  z-index:50;
  cursor:pointer;
  animation:sharkFloat 4s ease-in-out infinite;
  will-change:transform;
}
@keyframes sharkFloat{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-6px)}
}
.shark-mascot-img,.shark-mascot-video{
  position:absolute;
  inset:0;
  width:100%;height:100%;
  object-fit:cover;
  border-radius:50%;
  background:rgba(10,14,20,0.6);
  border:1.5px solid rgba(0,212,255,0.4);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  box-shadow:0 8px 24px rgba(0,0,0,0.5),0 0 20px rgba(0,212,255,0.2);
  transition:opacity 0.3s;
}
.shark-mascot-video{opacity:0}
.shark-mascot:hover .shark-mascot-img{opacity:0}
.shark-mascot:hover .shark-mascot-video{opacity:1}
.shark-mascot-bubble{
  position:absolute;
  bottom:calc(100% + 8px);
  right:50%;
  transform:translateX(50%) translateY(6px);
  background:linear-gradient(135deg,var(--cyan) 0%,var(--green) 100%);
  color:#0a0e14;
  padding:6px 12px;
  border-radius:12px;
  font-size:11px;
  font-weight:700;
  white-space:nowrap;
  opacity:0;
  pointer-events:none;
  transition:opacity 0.3s,transform 0.3s;
  box-shadow:0 6px 18px rgba(0,212,255,0.35);
}
.shark-mascot-bubble::after{
  content:'';
  position:absolute;
  top:100%;left:50%;
  transform:translateX(-50%);
  border:5px solid transparent;
  border-top-color:var(--green);
}
.shark-mascot:hover .shark-mascot-bubble{
  opacity:1;
  transform:translateX(50%) translateY(0);
}

@media(max-width:760px){
  .topbar{padding:0 16px;gap:4px}
  .brand-sub{display:none}
  .brand{padding-right:10px;margin-right:4px}
  .tab{padding:6px 10px;font-size:12px}
  .tab-icon{display:none}
  .status-info{display:none}
  .shark-mascot{width:56px;height:56px;bottom:14px;right:14px}
}
</style>
</head>
<body>

<!-- Top bar matching Gradio overview page style -->
<div class="topbar">
  <div class="brand">
    <span class="brand-icon">⚓</span>
    <span class="brand-text">轮机智脑</span>
    <span class="brand-sub">船舶发动机人工智能</span>
  </div>

  <div class="tabs">
    <a class="tab active" href="/app/"><span class="tab-icon">📊</span>总览</a>
    <a class="tab" href="/app/"><span class="tab-icon">📈</span>监控</a>
    <a class="tab" href="/app/"><span class="tab-icon">🖼️</span>视觉识别</a>
    <a class="tab" href="/app/"><span class="tab-icon">📂</span>数据历史</a>

    <div class="tab-sep"></div>

    <!-- New button: 传感器监控门户 -->
    <a class="tab new-btn" id="portalBtn" href="/static/monitor-portal.html" target="_blank" title="打开传感器监控门户">
      <span class="tab-icon">📡</span>传感器监控门户
      <span class="live-dot"></span>
    </a>
  </div>

  <div class="status">
    <div class="status-dot"></div>
    <span class="status-text">系统在线</span>
    <span class="status-info">12K98ME-C7</span>
  </div>
</div>

<!-- Gradio app iframe -->
<iframe class="app-frame" src="/app/"></iframe>

<!-- ====== Shark Mascot — 统一品牌陪伴 ====== -->
<div class="shark-mascot" id="sharkMascot" aria-hidden="true">
  <img class="shark-mascot-img" src="/static/shark.png" alt="小鲨">
  <video class="shark-mascot-video" src="/static/shark-shake.mp4" muted loop playsinline preload="none"></video>
  <div class="shark-mascot-bubble">小鲨陪你 🌊</div>
</div>

<script>
// Track which tab is active based on iframe URL changes (best-effort)
// Since iframe is cross-origin, we can only default to 总览
const tabs = document.querySelectorAll('.tab:not(.new-btn)');
tabs.forEach(tab => {
  tab.addEventListener('click', e => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
  });
});

// ====== Shark Mascot interaction ======
(function(){
  var sm = document.getElementById('sharkMascot');
  if (!sm) return;
  var sv = sm.querySelector('.shark-mascot-video');
  var loaded = false;
  function ensure(){ if(!loaded){ sv.load(); loaded = true; } }
  sm.addEventListener('mouseenter', function(){ ensure(); sv.play().catch(function(){}); });
  sm.addEventListener('mouseleave', function(){ sv.pause(); sv.currentTime = 0; });
  sm.addEventListener('click', function(){ ensure(); sv.play().catch(function(){}); });
})();
</script>
</body>
</html>
