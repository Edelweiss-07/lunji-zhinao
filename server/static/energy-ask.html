<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>能效管理智能体 | 12K98ME-C7</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#FFFFFF;
  --sb-bg:#F9FAFB;
  --sb-hover:#F1F3F5;
  --sb-active:#ECEEF1;
  --border:#E5E7EB;
  --border-strong:#D8DCE2;
  --tx:#1A1A1A;
  --tx2:#4B5563;
  --tx3:#9CA3AF;
  --accent:#4D6BFE;
  --accent-hover:#3F5CE8;
  --accent-soft:#EEF2FF;
  --accent-border:#DDE3FF;
  --user-bubble:#EFF6FF;
  --user-border:#DBEAFE;
  --red:#DC2626;
  --amber:#B45309;
  --amber-soft:#FEF6E7;
  --amber-border:#F5DFB0;
  --teal:#4D6BFE;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  background:var(--bg);color:var(--tx);font-size:15px;-webkit-font-smoothing:antialiased;overflow:hidden;
}
.mono{font-family:'SF Mono','Cascadia Code','Consolas',monospace}

/* ═══ 布局 ═══ */
.app{display:flex;height:100vh;height:100dvh}

/* ── 左侧栏 ── */
.sb{width:258px;flex-shrink:0;background:var(--sb-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:14px 10px 10px}
.sb-brand{display:flex;align-items:center;gap:9px;padding:2px 6px 14px}
.sb-logo{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sb-logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.sb-brand-tx{font-size:14.5px;font-weight:600;letter-spacing:-.01em}
.sb-new{display:flex;align-items:center;gap:8px;width:100%;padding:9px 11px;background:var(--bg);border:1px solid var(--border-strong);border-radius:9px;color:var(--tx);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .15s,border-color .15s}
.sb-new:hover{background:var(--sb-hover);border-color:var(--accent);color:var(--accent)}
.sb-new svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.sb-label{font-size:11.5px;color:var(--tx3);font-weight:500;padding:18px 8px 7px;letter-spacing:.02em}
.sb-scroll{flex:1;overflow-y:auto;min-height:0;margin:0 -2px;padding:0 2px}
.sb-scroll::-webkit-scrollbar{width:6px}
.sb-scroll::-webkit-scrollbar-thumb{background:#DFE3E8;border-radius:3px}
.sb-item{display:block;width:100%;text-align:left;padding:8px 10px;background:transparent;border:none;border-radius:8px;color:var(--tx2);font-family:inherit;font-size:13px;line-height:1.45;cursor:pointer;transition:background .12s,color .12s;margin-bottom:1px}
.sb-item:hover{background:var(--sb-hover);color:var(--tx)}
.sb-item:active{background:var(--sb-active)}
.sb-item span{display:block;font-size:11.5px;color:var(--tx3);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sb-foot{padding:11px 8px 4px;border-top:1px solid var(--border);margin-top:8px}
.sb-foot-row{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--tx3);line-height:1.5}
.sb-dot{width:6px;height:6px;border-radius:50%;background:#22C55E;flex-shrink:0}
.sb-tag{display:inline-block;padding:1px 6px;background:var(--amber-soft);border:1px solid var(--amber-border);color:var(--amber);border-radius:4px;font-size:10.5px;font-weight:600;margin-top:7px}

/* ── 主区 ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--bg)}
.topbar{height:52px;flex-shrink:0;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--border)}
.tb-menu{display:none;width:32px;height:32px;border:1px solid var(--border);background:var(--bg);border-radius:8px;cursor:pointer;align-items:center;justify-content:center}
.tb-menu svg{width:16px;height:16px;stroke:var(--tx2);fill:none;stroke-width:2;stroke-linecap:round}
.tb-title{font-size:14px;font-weight:600}
.tb-chip{display:flex;align-items:center;gap:6px;padding:5px 11px;background:var(--sb-bg);border:1px solid var(--border);border-radius:8px;font-size:12.5px;color:var(--tx2)}
.tb-chip b{color:var(--tx);font-weight:500}
.tb-links{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-link{padding:6px 12px;border:1px solid var(--border-strong);border-radius:8px;color:var(--tx2);font-size:12.5px;font-weight:500;text-decoration:none;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.tb-link:hover{background:var(--sb-hover);border-color:var(--accent);color:var(--accent)}

.body{flex:1;overflow-y:auto;min-height:0;padding:0 24px}
.body::-webkit-scrollbar{width:8px}
.body::-webkit-scrollbar-track{background:transparent}
.body::-webkit-scrollbar-thumb{background:#E3E6EA;border-radius:4px}
.body::-webkit-scrollbar-thumb:hover{background:#CDD2D8}
.main.is-empty .body{flex:0 0 auto;overflow:visible;padding-top:10vh}

/* ── 空状态 ── */
.empty{max-width:760px;margin:0 auto;text-align:center;padding:0 8px}
.empty-logo{width:48px;height:48px;border-radius:13px;background:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
.empty-logo svg{width:25px;height:25px;stroke:#fff;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.empty h1{font-size:23px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px}
.empty p{font-size:14px;color:var(--tx2);line-height:1.75;max-width:520px;margin:0 auto}

/* ── 消息 ── */
.msgs{max-width:760px;margin:0 auto;padding:26px 0 8px}
.msg{margin-bottom:30px}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .ub{background:var(--user-bubble);border:1px solid var(--user-border);border-radius:16px;padding:11px 17px;max-width:78%;line-height:1.7;font-size:15px;white-space:pre-wrap;word-break:break-word}
.msg.bot{display:flex;gap:13px}
.msg.bot .av{width:28px;height:28px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.msg.bot .av svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.msg.bot .ct{flex:1;min-width:0;line-height:1.8;font-size:15px;word-break:break-word}
.route{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--tx3);margin-bottom:9px}
.route-dot{width:5px;height:5px;border-radius:50%;background:#22C55E}
.route code{background:var(--sb-bg);border:1px solid var(--border);padding:1px 6px;border-radius:4px;font-family:'SF Mono','Consolas',monospace;font-size:11.5px;color:var(--tx2)}
.ct p{margin:0 0 11px}
.ct p:last-child{margin-bottom:0}
.ct strong{font-weight:600}
.ct ul{margin:8px 0 12px;padding-left:21px}
.ct li{margin-bottom:6px}
.ct code{background:var(--sb-bg);border:1px solid var(--border);padding:1.5px 6px;border-radius:4px;font-family:'SF Mono','Consolas',monospace;font-size:13px;color:#B4315E}
.ct h1,.ct h2,.ct h3{font-size:15.5px;font-weight:600;margin:17px 0 9px}
.ct h1:first-child,.ct h2:first-child,.ct h3:first-child{margin-top:0}
.ct table{border-collapse:collapse;margin:11px 0;font-size:13.5px;width:100%}
.ct th,.ct td{border:1px solid var(--border);padding:7px 11px;text-align:left}
.ct th{background:var(--sb-bg);font-weight:600}
.cursor{display:inline-block;width:2px;height:16px;background:var(--accent);margin-left:1px;vertical-align:text-bottom;animation:blink .9s step-end infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
.thinking{display:flex;align-items:center;gap:9px;color:var(--tx3);font-size:13.5px}
.spin{width:13px;height:13px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── 输入区 ── */
.composer{flex-shrink:0;padding:8px 24px 14px}
.main.is-empty .composer{padding-top:0}
.cbox{max-width:760px;margin:0 auto;background:var(--bg);border:1px solid var(--border-strong);border-radius:22px;padding:11px 11px 11px 18px;display:flex;gap:10px;align-items:flex-end;transition:border-color .15s,box-shadow .15s}
.cbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,107,254,.09)}
.cbox textarea{flex:1;background:transparent;border:none;outline:none;color:var(--tx);font-family:inherit;font-size:15px;line-height:1.65;resize:none;max-height:150px;min-height:25px;padding:3px 0}
.cbox textarea::placeholder{color:var(--tx3)}
.send{width:34px;height:34px;flex-shrink:0;border:none;border-radius:50%;background:var(--accent);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.send:hover:not(:disabled){background:var(--accent-hover)}
.send:disabled{background:#E5E7EB;cursor:not-allowed}
.send svg{width:17px;height:17px;stroke:#fff;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.send:disabled svg{stroke:#9CA3AF}
.hint{max-width:760px;margin:9px auto 0;font-size:11.5px;color:var(--tx3);text-align:center;line-height:1.6}

/* ── 移动端 ── */
@media(max-width:880px){
  .sb{position:fixed;top:0;bottom:0;left:0;z-index:30;transform:translateX(-100%);transition:transform .22s ease;box-shadow:0 0 40px rgba(0,0,0,.12)}
  .sb.open{transform:none}
  .sb-mask{display:none;position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:20}
  .sb-mask.open{display:block}
  .tb-menu{display:flex}
  .body,.composer{padding-left:16px;padding-right:16px}
  .msg.user .ub{max-width:88%}
}
@media(min-width:881px){.sb-mask{display:none!important}}
</style>
</head>
<body>

<div class="app">

  <!-- ═══ 左侧栏 ═══ -->
  <aside class="sb" id="sb">
    <div class="sb-brand">
      <div class="sb-logo"><svg viewBox="0 0 24 24"><path d="M4 18h4M4 12h8M4 6h16"/><path d="M17 14l3 3-3 3"/></svg></div>
      <div class="sb-brand-tx">能效管理智能体</div>
    </div>

    <button class="sb-new" id="newChat">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
      新对话
    </button>

    <div class="sb-label">常见问题</div>
    <div class="sb-scroll" id="presetList"></div>

    <div class="sb-foot">
      <div class="sb-foot-row"><span class="sb-dot"></span>知识库已就绪</div>
      <div class="sb-foot-row" style="margin-top:5px">MAN 12K98ME-C7 能效优化库</div>
      <span class="sb-tag">测试功能</span>
    </div>
  </aside>
  <div class="sb-mask" id="sbMask"></div>

  <!-- ═══ 主区 ═══ -->
  <main class="main is-empty" id="main">

    <div class="topbar">
      <button class="tb-menu" id="tbMenu" title="常见问题">
        <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="tb-title">能效管理智能问答</div>
      <div class="tb-chip"><span>意图</span><b>能效管理与碳合规</b></div>
      <div class="tb-chip"><span>模型</span><b>DS V4 Pro</b></div>
      <div class="tb-links">
        <a class="tb-link" href="/static/energy-system.html">监测面板</a>
      </div>
    </div>

    <div class="body" id="body">
      <div class="empty" id="empty">
        <div class="empty-logo"><svg viewBox="0 0 24 24"><path d="M4 18h4M4 12h8M4 6h16"/><path d="M17 14l3 3-3 3"/></svg></div>
        <h1>我是能效管理智能体</h1>
        <p>基于 MAN B&amp;W 12K98ME-C7 台架实测数据与 IMO 能效法规体系（SEEMP / EEXI / CII / DCS），回答能效、碳合规与省油降耗相关问题。左侧常见问题可随时点击。</p>
      </div>
      <div class="msgs" id="msgs"></div>
    </div>

    <div class="composer">
      <div class="cbox">
        <textarea id="q" rows="1" placeholder="给能效管理智能体发送消息"></textarea>
        <button class="send" id="send" title="发送" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <div class="hint">内容由 AI 生成，请仔细甄别 · Enter 发送 / Shift+Enter 换行</div>
    </div>

  </main>
</div>

<script>
// ═══════════ 常见问题（左侧栏常驻，随时可点） ═══════════
const PRESETS = [
  {t:'SFOC 与负荷',   q:'本机 12K98ME-C7 在不同负荷下的 SFOC 是多少？75% 负荷为什么最省油？'},
  {t:'经济航速',     q:'这台主机对应的经济航速怎么确定？降速航行能省多少油？'},
  {t:'CII 评级',     q:'我们的船 CII 评级怎么算？多少算达标？被评为 D 级或 E 级有什么后果？'},
  {t:'EEXI 达标',    q:'EEXI 是什么？我们的 12K98ME-C7 主机需要满足什么要求才算达标？'},
  {t:'碳合规申报',   q:'船舶碳合规需要向谁申报什么数据？SEEMP 和 DCS 分别是什么要求？'},
  {t:'省油措施',     q:'在不影响航期的前提下，有哪些可落地的省油降耗措施？'},
  {t:'油耗偏高排查', q:'主机燃油消耗率偏高，应该从哪些方面排查原因？'},
  {t:'碳排放核算',   q:'船舶燃油消耗如何换算成 CO₂ 排放？碳排放因子是多少？'},
];

const mainEl  = document.getElementById('main');
const bodyEl  = document.getElementById('body');
const msgsEl  = document.getElementById('msgs');
const emptyEl = document.getElementById('empty');
const qEl     = document.getElementById('q');
const sendBtn = document.getElementById('send');
const sbEl    = document.getElementById('sb');
const sbMask  = document.getElementById('sbMask');

let busy = false;

// 左侧栏常见问题
document.getElementById('presetList').innerHTML = PRESETS.map((p,i) =>
  `<button class="sb-item" data-i="${i}">${p.t}<span>${p.q}</span></button>`
).join('');
document.getElementById('presetList').addEventListener('click', e => {
  const b = e.target.closest('.sb-item');
  if (!b || busy) return;
  closeSb();
  ask(PRESETS[+b.dataset.i].q);
});

// 新对话
document.getElementById('newChat').addEventListener('click', () => {
  if (busy) return;
  msgsEl.innerHTML = '';
  emptyEl.style.display = '';
  mainEl.classList.add('is-empty');
  closeSb();
  qEl.focus();
});

// 移动端侧栏
const openSb  = () => { sbEl.classList.add('open'); sbMask.classList.add('open'); };
const closeSb = () => { sbEl.classList.remove('open'); sbMask.classList.remove('open'); };
document.getElementById('tbMenu').addEventListener('click', openSb);
sbMask.addEventListener('click', closeSb);

// 输入
qEl.addEventListener('input', () => {
  qEl.style.height = 'auto';
  qEl.style.height = Math.min(qEl.scrollHeight, 150) + 'px';
  sendBtn.disabled = !qEl.value.trim() || busy;
});
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
});
sendBtn.addEventListener('click', doSend);
function doSend(){
  const v = qEl.value.trim();
  if (!v || busy) return;
  qEl.value = '';
  qEl.style.height = 'auto';
  sendBtn.disabled = true;
  ask(v);
}

// ═══════════ 轻量 Markdown 渲染 ═══════════
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function inlineMd(s){
  return s.replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
          .replace(/`([^`\n]+)`/g,'<code>$1</code>');
}
function md(src){
  const lines = esc(src).split('\n');
  const out = [];
  let list = [], para = [];
  const flushList = () => { if(list.length){ out.push('<ul>'+list.join('')+'</ul>'); list = []; } };
  const flushPara = () => { if(para.length){ out.push('<p>'+para.join('<br>')+'</p>'); para = []; } };
  const isRow = s => /^\s*\|.*\|\s*$/.test(s);
  let i = 0;
  while (i < lines.length){
    const ln = lines[i];
    if (isRow(ln)){
      flushPara(); flushList();
      const rows = [];
      while (i < lines.length && isRow(lines[i])){ rows.push(lines[i]); i++; }
      if (rows.length >= 2 && /^[\s\-:|]+$/.test(rows[1])){
        const cells = r => r.split('|').slice(1,-1).map(c => inlineMd(c.trim()));
        out.push('<table><thead><tr>' + cells(rows[0]).map(c=>`<th>${c}</th>`).join('') +
          '</tr></thead><tbody>' +
          rows.slice(2).map(r=>'<tr>'+cells(r).map(c=>`<td>${c}</td>`).join('')+'</tr>').join('') +
          '</tbody></table>');
      } else {
        rows.forEach(r => out.push('<p>' + inlineMd(r) + '</p>'));
      }
      continue;
    }
    const h = ln.match(/^\s*(#{1,3})\s+(.+)$/);
    if (h){
      flushPara(); flushList();
      const lv = h[1].length;
      out.push(`<h${lv}>${inlineMd(h[2])}</h${lv}>`);
      i++; continue;
    }
    if (/^\s*([-*]|\d+\.)\s+/.test(ln)){
      flushPara();
      list.push('<li>' + inlineMd(ln.replace(/^\s*([-*]|\d+\.)\s+/, '')) + '</li>');
      i++; continue;
    }
    if (!ln.trim()){ flushPara(); flushList(); i++; continue; }
    flushList();
    para.push(inlineMd(ln));
    i++;
  }
  flushPara(); flushList();
  return out.join('');
}

const BOT_AV = '<div class="av"><svg viewBox="0 0 24 24"><path d="M4 18h4M4 12h8M4 6h16"/><path d="M17 14l3 3-3 3"/></svg></div>';

function enterChatMode(){
  if (!mainEl.classList.contains('is-empty')) return;
  emptyEl.style.display = 'none';
  mainEl.classList.remove('is-empty');
}

function addUser(text){
  const d = document.createElement('div');
  d.className = 'msg user';
  d.innerHTML = `<div class="ub">${esc(text)}</div>`;
  msgsEl.appendChild(d);
  scroll();
}
function addBot(){
  const d = document.createElement('div');
  d.className = 'msg bot';
  d.innerHTML = BOT_AV + `<div class="ct">
      <div class="thinking"><span class="spin"></span><span class="think-txt">思考中…</span></div>
    </div>`;
  msgsEl.appendChild(d);
  scroll();
  return d.querySelector('.ct');
}
function scroll(){ bodyEl.scrollTop = bodyEl.scrollHeight; }

// ═══════════ 提问（SSE 流式） ═══════════
async function ask(text){
  if (busy) return;
  busy = true; sendBtn.disabled = true;
  enterChatMode();

  addUser(text);
  const ct = addBot();
  const think = ct.querySelector('.thinking');
  const thinkTxt = ct.querySelector('.think-txt');

  let slowTimer = setTimeout(() => {
    if (thinkTxt) thinkTxt.textContent = '服务冷启动中，请稍候（首次约 30~90 秒）…';
  }, 4000);

  let raw = '', contentEl = null;

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ query: text, system: '能效管理', history: [] }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = '';

    while (true){
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream: true});
      const parts = buf.split('\n\n');
      buf = parts.pop();
      for (const part of parts){
        const line = part.split('\n').find(l => l.startsWith('data:'));
        if (!line) continue;
        let ev;
        try { ev = JSON.parse(line.slice(5).trim()); } catch(e){ continue; }

        if (ev.type === 'meta'){
          clearTimeout(slowTimer);
          if (think) think.remove();
          const route = document.createElement('div');
          route.className = 'route';
          route.innerHTML = `<span class="route-dot"></span>已路由至 <code>${esc(ev.intent || '能效管理与碳合规')}</code>` +
            `<code>${esc(ev.model || 'DS V4 Pro')}</code>`;
          ct.insertBefore(route, ct.firstChild);
          contentEl = document.createElement('div');
          ct.appendChild(contentEl);
        } else if (ev.type === 'token'){
          clearTimeout(slowTimer);
          if (think) think.remove();
          raw += ev.text;
          if (!contentEl){ contentEl = document.createElement('div'); ct.appendChild(contentEl); }
          contentEl.innerHTML = md(raw) + '<span class="cursor"></span>';
          scroll();
        } else if (ev.type === 'empty'){
          clearTimeout(slowTimer);
          if (think) think.remove();
          ct.insertAdjacentHTML('beforeend', '<p>请输入有效的问题。</p>');
        }
      }
    }
    clearTimeout(slowTimer);
    if (think) think.remove();
    if (contentEl) contentEl.innerHTML = md(raw) || '<p>（无返回内容）</p>';
    else if (!raw) ct.insertAdjacentHTML('beforeend', '<p style="color:var(--tx3)">未收到回答，请重试。</p>');

  } catch(err){
    clearTimeout(slowTimer);
    if (think) think.remove();
    ct.insertAdjacentHTML('beforeend',
      `<p style="color:var(--red)">请求失败：${esc(String(err.message||err))}</p>
       <p style="color:var(--tx3);font-size:13px">可能是服务冷启动未完成或网络中断，请稍后重试。</p>`);
  } finally {
    busy = false;
    sendBtn.disabled = !qEl.value.trim();
    scroll();
    if (window.innerWidth > 880) qEl.focus();
  }
}

qEl.focus();
</script>
</body>
</html>
