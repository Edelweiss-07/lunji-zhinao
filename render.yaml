# Render Blueprint — 轮机智脑（单服务方案）
# 一个 Web 服务承载全部功能：
#   /        着陆页 index.html（海洋主题门户，同本地首页）
#   /portal  监控台外壳（标签导航 + iframe → /app）
#   /app     Gradio 主应用（总览/监控/视觉识别/数据历史）
#   /history 历史数据页
#   /api/*   数据接口
# 用法：Render Dashboard → New → Blueprint → 选择本仓库（或手动 New Web Service）
services:
  - type: web
    name: lunji-zhinao-server
    runtime: python
    plan: free
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /api/list
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: SCHOOL_API_BASE
        value: https://chat.cqjtu.edu.cn/ds/api/v1
      # 以下三个密钥在 Blueprint 应用时手动填写（不会写入 Git）
      - key: SCHOOL_API_KEY
        sync: false
      - key: DSV4_KEY
        sync: false
      - key: DSR1_API_KEY
        sync: false
